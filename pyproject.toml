[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-playwright-reporter"
version = "1.0.8"
description = "Python bridge for Playwright Smart Reporter - AI-powered test analysis and reporting"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Gary Parker" },
    { name = "KUSHAL-OMNIUS" },
]

dependencies = [
    "pytest>=7.4",
    "pytest-json-report>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest-playwright",
    "build",
]

[project.urls]
Upstream = "https://github.com/kushal-omnius/python-playwright-reporter"

[project.entry-points.pytest11]
playwright_smart_reporter = "python_playwright_reporter.plugin"

[tool.setuptools.packages.find]
include = ["python_playwright_reporter*"]

[tool.setuptools.package-data]
python_playwright_reporter = [
    "py.typed",
    "_bundled_dist/**/*.js",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
